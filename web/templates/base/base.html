<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CLARA — Clinical Longitudinal AI Research Assistant{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/css/bootstrap.min.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@3.4.1/dist/js/bootstrap.min.js"></script>
  {% load static %}
  <link rel="icon" type="image/svg+xml" href="{% static 'assets/ui/logo.svg' %}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    /* ── Global Nav Bar ── */
    .global-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
      /* Glassmorphism background */
      background: rgba(13,17,23,0.85);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      /* No solid border — gradient pseudo-element replaces it */
      border-bottom: none;
      height: 44px; display: flex; align-items: center; padding: 0 20px;
      font-size: 0.92em; gap: 4px;
    }
    /* Gradient bottom border via pseudo-element */
    .global-nav::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue), transparent);
      opacity: 0.6;
    }
    .global-nav a {
      color: var(--text-muted); text-decoration: none; padding: 6px 12px;
      border-radius: 4px; transition: all 0.2s; white-space: nowrap;
      position: relative;
    }
    .global-nav a:not(.nav-brand):hover {
      color: var(--accent-cyan); background: rgba(57,210,192,0.06);
      text-decoration: none;
    }
    .global-nav a.nav-active {
      color: var(--accent-cyan); background: rgba(57,210,192,0.1);
      border-radius: 20px;
      box-shadow: 0 0 12px rgba(57,210,192,0.1);
    }
    .global-nav .nav-brand {
      font-weight: 800; font-size: 1.5em;
      margin-right: 10px; letter-spacing: 0.5px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 4px 10px; border-radius: 6px;
      filter: drop-shadow(0 0 8px rgba(57,210,192,0.35));
      transition: all 0.3s ease;
    }
    .global-nav .nav-brand:hover {
      filter: drop-shadow(0 0 14px rgba(57,210,192,0.5));
      transform: scale(1.03);
    }
    .global-nav .nav-brand img {
      width: 42px; height: 42px; -webkit-text-fill-color: initial;
      filter: drop-shadow(0 0 6px rgba(57,210,192,0.4));
      transition: all 0.3s ease;
    }
    .global-nav .nav-brand:hover img {
      filter: drop-shadow(0 0 10px rgba(57,210,192,0.6));
      transform: rotate(-5deg) scale(1.08);
    }
    .global-nav .nav-sep {
      color: var(--border); margin: 0 2px; user-select: none;
    }
    .global-nav .nav-crumb {
      color: var(--text-secondary); font-family: 'JetBrains Mono', monospace;
      font-size: 0.95em;
    }
    body { padding-top: 44px; }
    body.no-nav-pad { padding-top: 0; }
    body.no-nav-pad .global-nav { display: none; }

    /* ── Run Sidebar ── */
    .run-sidebar {
      position: fixed; top: 44px; left: 0; bottom: 0; width: 60px;
      z-index: 200;
      background: rgba(13,17,23,0.92);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      display: flex; flex-direction: column; align-items: center;
      padding: 14px 0; gap: 4px;
    }
    .run-sidebar::after {
      content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 1px;
      background: linear-gradient(180deg, var(--accent-cyan), var(--accent-blue), transparent);
      opacity: 0.25;
    }
    .run-sidebar a {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 4px; width: 50px; height: 50px; border-radius: 10px;
      color: var(--text-secondary); text-decoration: none;
      transition: all 0.15s; position: relative;
    }
    .run-sidebar a span {
      font-size: 0.7em; font-weight: 600; letter-spacing: 0.3px;
      line-height: 1; white-space: nowrap;
    }
    .run-sidebar a:hover {
      color: var(--text-primary); background: var(--bg-elevated);
      text-decoration: none;
    }
    .run-sidebar a.sb-active {
      color: var(--accent-cyan); background: rgba(57,210,192,0.1);
    }
    body.has-sidebar { padding-left: 60px; }

    /* ── Nav CTA Button (action link, e.g. "Simulation Runs") ── */
    .global-nav a.nav-cta {
      color: var(--accent-cyan);
      border: 1px solid rgba(57,210,192,0.35);
      border-radius: 20px;
      padding: 4px 14px;
      font-weight: 600;
      font-size: 0.92em;
      letter-spacing: 0.2px;
      background: rgba(57,210,192,0.06);
      transition: all 0.25s ease;
      margin-left: 4px;
    }
    .global-nav a.nav-cta:hover {
      background: rgba(57,210,192,0.15);
      border-color: rgba(57,210,192,0.6);
      box-shadow: 0 0 14px rgba(57,210,192,0.15);
      color: #fff;
    }
    .global-nav a.nav-cta svg {
      width: 12px; height: 12px;
      vertical-align: -1px;
      margin-right: 4px;
      stroke: currentColor;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <!-- Global Navigation -->
  <nav class="global-nav">
    <a href="/" class="nav-brand" title="Clinical Longitudinal AI Research Assistant">{% load static %}<img src="{% static 'assets/ui/logo.svg' %}" alt="C">CLARA</a>
    {% block nav_items %}{% endblock %}
  </nav>

  {% block run_sidebar %}{% endblock %}

  {% block content %}{% endblock %}
  {% block js_content %}{% endblock %}
</body>
</html>
