services:
  django:
    build:
      context: .
      dockerfile: Dockerfile.django
    container_name: ${VITAL_CONTAINER:-clara_dev}
    restart: unless-stopped
    ports:
      - "${VITAL_PORT:-19001}:9001"
    volumes:
      - ./data:/app/data
      - ./frontend:/app/frontend
      - ./src:/app/src
      - ./validation:/app/validation
    environment:
      CTE_VLLM_BASE_URL: "http://clara-medgemma4b-antihallu:8000/v1"
      CTE_VLLM_MODEL_ID: "medgemma-4b-antihallu"
      CTE_VLLM_API_KEY: "EMPTY"
      MEDGEMMA4B_VLLM_BASE_URL: "http://clara-medgemma4b-antihallu:8000/v1"
      MEDGEMMA4B_MODEL_ID: "medgemma-4b-ctcae"
      MEDGEMMA4B_BASE_VLLM_BASE_URL: "http://clara-medgemma4b-base:8000/v1"
      MEDGEMMA4B_BASE_MODEL_ID: "medgemma-1.5-4b-it"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY}"
      CARE_AI_API_URL: "http://clara-data-collection-agent:8300"
      PYTHONPATH: "/app"
    networks:
      - vital-net

  medgemma4b-base:
    image: vllm/vllm-openai:latest
    container_name: clara-medgemma4b-base
    restart: unless-stopped
    ports:
      - "38004:8000"
    profiles:
      - medgemma4b-base
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - /home/samuel/.cache/huggingface/hub/models--google--medgemma-1.5-4b-it:/model_cache:ro
    shm_size: "4g"
    command:
      - "--model"
      - "/model_cache/snapshots/e9792da5fb8ee651083d345ec4bce07c3c9f1641"
      - "--served-model-name"
      - "medgemma-1.5-4b-it"
      - "--dtype"
      - "bfloat16"
      - "--max-model-len"
      - "4096"
      - "--limit-mm-per-prompt"
      - '{"image": 2}'
      - "--port"
      - "8000"
      - "--gpu-memory-utilization"
      - "0.6"
      - "--trust-remote-code"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["2"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - vital-net

  medgemma4b-antihallu-ft:
    image: vllm/vllm-openai:latest
    container_name: clara-medgemma4b-antihallu
    restart: unless-stopped
    ports:
      - "38002:8000"
    profiles:
      - medgemma4b-antihallu
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - /home/samuel/.cache/huggingface/hub/models--newmes--medgemma-4b-antihallu:/model_cache:ro
      - /home/samuel/.cache/huggingface/hub/models--google--medgemma-1.5-4b-it/blobs/1299c11d7cf632ef3b4e11937501358ada021bbdf7c47638d13c0ee982f2e79c:/model_cache/snapshots/66102b70ed9074a1dddf19d1bca6f8942cb2a9c6/tokenizer.model:ro
      - /home/samuel/.cache/huggingface/hub/models--google--medgemma-1.5-4b-it/blobs/7d4046bf0505a327dd5a0abbb427ecd4fc82f99c2ceaa170bc61ecde12809b0c:/model_cache/snapshots/66102b70ed9074a1dddf19d1bca6f8942cb2a9c6/tokenizer.json:ro
      - /home/samuel/.cache/huggingface/hub/models--google--medgemma-4b-it/blobs/72c9f6bc082907666631052305438b5e7db2a8e2:/model_cache/snapshots/66102b70ed9074a1dddf19d1bca6f8942cb2a9c6/tokenizer_config.json:ro
      - /home/samuel/.cache/huggingface/hub/models--google--medgemma-1.5-4b-it/blobs/1a6193244714d3d78be48666cb02cdbfac62ad86:/model_cache/snapshots/66102b70ed9074a1dddf19d1bca6f8942cb2a9c6/special_tokens_map.json:ro
      - /home/samuel/.cache/huggingface/hub/models--google--medgemma-1.5-4b-it/blobs/e17bde03d42feda32d1abfca6d3b598b9a020df7:/model_cache/snapshots/66102b70ed9074a1dddf19d1bca6f8942cb2a9c6/added_tokens.json:ro
      - /home/samuel/.cache/huggingface/hub/models--google--medgemma-1.5-4b-it/blobs/cbd4f0cd77e39566f11921f9995bb3a4d008a83e:/model_cache/snapshots/66102b70ed9074a1dddf19d1bca6f8942cb2a9c6/preprocessor_config.json:ro
    shm_size: "4g"
    command:
      - "--model"
      - "/model_cache/snapshots/66102b70ed9074a1dddf19d1bca6f8942cb2a9c6"
      - "--served-model-name"
      - "medgemma-4b-antihallu"
      - "--dtype"
      - "bfloat16"
      - "--max-model-len"
      - "4096"
      - "--limit-mm-per-prompt"
      - '{"image": 2}'
      - "--port"
      - "8000"
      - "--gpu-memory-utilization"
      - "0.6"
      - "--trust-remote-code"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_MEDGEMMA4B:-3}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - vital-net

  antihallu-server:
    build:
      context: .
      dockerfile: Dockerfile.antihallu
    container_name: clara-antihallu
    restart: unless-stopped
    ports:
      - "38003:8000"
    profiles:
      - antihallu
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      GRPO_MODEL_PATH: "/model_dapo_cache/snapshots/66102b70ed9074a1dddf19d1bca6f8942cb2a9c6"
      DAPO_SYSTEM_PROMPT: "You are a helpful medical AI assistant. If you are not sure about something, say so. Do not make up information. Always recommend consulting a healthcare professional."
    volumes:
      - /home/samuel/.cache/huggingface:/hf_cache:ro
      - /home/samuel/.cache/huggingface/hub/models--newmes--medgemma-4b-antihallu:/model_dapo_cache:ro
    shm_size: "4g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ANTIHALLU:-1}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\""]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks:
      - vital-net

  data-collection-agent:
    build:
      context: .
      dockerfile: Dockerfile.data-collection-agent
    container_name: clara-data-collection-agent
    restart: unless-stopped
    ports:
      - "38005:8300"
    profiles:
      - data-collection-agent
    environment:
      CARE_AI_GPU: "0"
      CARE_AI_PORT: "8300"
      MEDASR_GPU: "0"
      SIGLIP_ENCODER_DEVICE: "cuda:0"
      VLLM_BASE_URL: "http://clara-medgemma4b-base:8000/v1"
      VLLM_MODEL_ID: "medgemma-1.5-4b-it"
      VLLM_API_KEY: "EMPTY"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY}"
      HF_HOME: "/hf_cache"
      HF_TOKEN: "${HF_TOKEN}"
      MEDASR_MODEL_PATH: "/hf_cache/hub/models--google--medasr/snapshots/7383e5e461baa820bdf9060652fe51b333bafba5"
    volumes:
      - /home/samuel/.cache/huggingface:/hf_cache
      - /home/samuel/.cache/huggingface/hub/models--google--medgemma-4b-it:/model_repo:ro
      - /home/samuel/CLARA/data:/data:ro
    shm_size: "4g"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_CARE_AI:-1}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8300/v1/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
    networks:
      - vital-net

networks:
  vital-net:
    external: true
